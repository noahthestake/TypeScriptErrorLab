# ISIT 300 Week 7 TypeScript error lab — field guide.
# Bun serves this folder and transpiles TypeScript. It does not check types.
# Edit site/app.ts, save, refresh. Open http://localhost:8088
# Image: https://hub.docker.com/r/oven/bun

services:
  web:
    image: oven/bun:1
    working_dir: /app
    command: ["bun", "server.ts"]
    ports:
      - "8088:3000"
    volumes:
      - .:/app
